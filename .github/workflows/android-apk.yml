name: Android APK - first build diagnosis

on:
  push:
    branches:
      - build/android-apk-first-test
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout original Flutter app
        uses: actions/checkout@v4
      - name: Install Java 8 for original Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Flutter compatible with original source
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '1.22.6'
          channel: stable
          cache: false
      - name: Report tool versions
        run: |
          flutter --version
          java -version
      - name: Restore project packages
        run: flutter pub get
      - name: Patch obsolete geocoder Android Gradle dependency in build cache only
        run: |
          set -eu
          find "$HOME/.pub-cache" -path '*/geocoder-*/android/build.gradle' -print -exec sed -i 's/com.android.tools.build:gradle:2\.3\.3/com.android.tools.build:gradle:3.2.1/g' {} \;
          find "$HOME/.pub-cache" -path '*/geocoder-*/android/build.gradle' -exec grep -n 'com.android.tools.build:gradle' {} \;
      - name: Build original Android debug APK
        run: flutter build apk --debug
      - name: Upload APK if successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uber-clone-original-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
